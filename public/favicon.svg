<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The step change: a flat baseline, a sharp riser, a new plateau. It is the
       shape almost every experiment here ends up drawing — a measure sits flat
       under every lever you pull, until one lever moves it. Amber on ink so it
       holds up against both a light and a dark browser tab. -->
  <rect width="32" height="32" rx="7" fill="#0b0b0b"/>
  <path d="M6.5 23H14.5V9H25.5" fill="none" stroke="#e69f00"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
